name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-2025
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore .\OSCQueryExplorer.slnx

      - name: Verify formatting
        run: dotnet format .\OSCQueryExplorer.slnx --no-restore --verify-no-changes --severity warn

      - name: Build
        run: dotnet build .\OSCQueryExplorer.slnx -c Release --no-restore -warnaserror -p:ContinuousIntegrationBuild=true

      - name: Test
        run: dotnet test --project .\OSCQueryExplorer.Tests\OSCQueryExplorer.Tests.csproj -c Release --no-build --no-restore --minimum-expected-tests 45
