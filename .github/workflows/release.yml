name: Build and release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the v prefix"
        required: true
        type: string
      prerelease:
        description: "Mark the GitHub Release as a prerelease"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: windows-2025
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $version = "${{ inputs.version }}".TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+([-.][0-9A-Za-z.-]+)?$') {
            throw "Invalid release version: $version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Check release tag
        id: tag
        shell: pwsh
        run: |
          $tag = '${{ steps.version.outputs.tag }}'
          git fetch origin --tags --force
          if ($LASTEXITCODE -ne 0) {
            throw 'Failed to fetch release tags from origin.'
          }
          $existingTag = git tag --list $tag
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to check whether tag $tag exists."
          }
          if ($existingTag) {
            $existingCommit = git rev-list -n 1 $tag
            if ($LASTEXITCODE -ne 0 -or -not $existingCommit) {
              throw "Failed to resolve existing tag $tag."
            }
            if ($existingCommit.Trim() -ne $env:GITHUB_SHA) {
              throw "Tag $tag already points to $existingCommit instead of $env:GITHUB_SHA."
            }
            "exists=true" >> $env:GITHUB_OUTPUT
            Write-Host "Tag $tag already points to this commit; it will be reused."
          } else {
            "exists=false" >> $env:GITHUB_OUTPUT
          }

      - name: Restore
        shell: pwsh
        run: |
          dotnet restore .\OSCQueryExplorer.slnx
          dotnet restore .\OSCQueryExplorer\OSCQueryExplorer.csproj -r win-x64

      - name: Build
        run: dotnet build .\OSCQueryExplorer.slnx -c Release --no-restore -p:ContinuousIntegrationBuild=true -p:Version=${{ steps.version.outputs.version }}

      - name: Test
        run: dotnet test --project .\OSCQueryExplorer.Tests\OSCQueryExplorer.Tests.csproj -c Release --no-build --no-restore --minimum-expected-tests 32

      - name: Publish portable self-contained build
        run: >-
          dotnet publish .\OSCQueryExplorer\OSCQueryExplorer.csproj
          -c Release -r win-x64 --self-contained true --no-restore
          -p:Version=${{ steps.version.outputs.version }}
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -o .\artifacts\portable

      - name: Publish framework-dependent build
        run: >-
          dotnet publish .\OSCQueryExplorer\OSCQueryExplorer.csproj
          -c Release -r win-x64 --self-contained false --no-restore
          -p:Version=${{ steps.version.outputs.version }}
          -p:DebugType=None
          -o .\artifacts\framework-dependent

      - name: Add notices to distributions
        shell: pwsh
        run: |
          Copy-Item .\README.md .\artifacts\portable\README.md
          Copy-Item .\LICENSE .\artifacts\portable\LICENSE
          Copy-Item .\THIRD-PARTY-NOTICES.md .\artifacts\portable\THIRD-PARTY-NOTICES.md
          Copy-Item .\README.md .\artifacts\framework-dependent\README.md
          Copy-Item .\LICENSE .\artifacts\framework-dependent\LICENSE
          Copy-Item .\THIRD-PARTY-NOTICES.md .\artifacts\framework-dependent\THIRD-PARTY-NOTICES.md

      - name: Create portable ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path .\artifacts\portable\* -DestinationPath .\artifacts\OSCQueryExplorer-${{ steps.version.outputs.version }}-win-x64-portable.zip -CompressionLevel Optimal

      - name: Locate Inno Setup
        id: inno
        shell: pwsh
        run: |
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw 'Inno Setup 6 is not available on this runner.' }
          "path=$iscc" >> $env:GITHUB_OUTPUT

      - name: Build installer
        shell: pwsh
        run: |
          & '${{ steps.inno.outputs.path }}' `
            "/DAppVersion=${{ steps.version.outputs.version }}" `
            "/DSourceDir=$((Resolve-Path .\artifacts\framework-dependent).Path)" `
            "/DOutputDir=$((Resolve-Path .\artifacts).Path)" `
            .\installer\OSCQueryExplorer.iss

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OSCQueryExplorer-${{ steps.version.outputs.version }}
          path: |
            artifacts/*.zip
            artifacts/*-setup.exe
          if-no-files-found: error

      - name: Create and push release tag
        if: steps.tag.outputs.exists != 'true'
        shell: pwsh
        run: |
          $tag = '${{ steps.version.outputs.tag }}'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag --annotate $tag --message "OSCQuery Explorer $tag" $env:GITHUB_SHA
          git push origin "refs/tags/$tag"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: OSCQuery Explorer ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          prerelease: ${{ inputs.prerelease || contains(steps.version.outputs.version, '-') }}
          files: |
            artifacts/*.zip
            artifacts/*-setup.exe
